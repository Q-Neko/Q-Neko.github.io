<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B6E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E1A28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Orbit rings -->
  <circle cx="400" cy="225" r="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="400" cy="225" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="400" cy="225" r="240" fill="none" stroke="rgba(142,26,40,0.3)" stroke-width="1"/>

  <!-- Center circle -->
  <circle cx="400" cy="225" r="48" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Q-Neko "Q" letter placeholder -->
  <text x="400" y="240" font-family="sans-serif" font-size="42" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" dominant-baseline="middle">Q</text>

  <!-- Orbit dots -->
  <circle cx="400" cy="105" r="6" fill="#ffffff" opacity="0.7"/>
  <circle cx="520" cy="338" r="5" fill="#8E1A28" opacity="0.9"/>
  <circle cx="178" cy="155" r="4" fill="rgba(255,255,255,0.5)"/>

  <!-- Bottom label -->
  <text x="400" y="416" font-family="monospace" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.35)" text-anchor="middle" text-transform="uppercase">Q-NEKO · QUANTUM NETWORK</text>
</svg>
